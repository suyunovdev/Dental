services:
  db:
    image: postgres:17-alpine
    container_name: f2-db
    environment:
      POSTGRES_USER: f2
      POSTGRES_PASSWORD: f2
      POSTGRES_DB: f2
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f2 -d f2"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
