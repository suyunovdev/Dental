name: Deploy Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          ssh "$STAGING_USER@$STAGING_HOST" \
            "cd /opt/f2 && git fetch && git checkout $GITHUB_SHA && docker compose -f docker-compose.prod.yml up -d --build"

          for i in $(seq 1 30); do
            if curl -sf http://$STAGING_HOST/api/health > /dev/null; then
              echo "Staging is healthy"
              exit 0
            fi
            echo "Waiting for staging... ($i/30)"
            sleep 10
          done

          echo "Staging health check failed"
          exit 1
