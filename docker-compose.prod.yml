services:
  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: f2
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: dental
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f2 -d dental"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://f2:${DB_PASSWORD:?}@db:5432/dental
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      NODE_ENV: ${NODE_ENV:?}
      PORT: 3000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /data/uploads
      CLINIC_NAME: ${CLINIC_NAME:?}
      CLINIC_PHONE: ${CLINIC_PHONE:?}
    volumes:
      - uploads:/data/uploads
    expose:
      - "3000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  uploads:
